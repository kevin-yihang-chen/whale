# Shared task interface: Qwen's 0--1000 convention, always the initial image.
tools:
  - class_name: ours.normalized_visual_zoom.NormalizedEvidenceZoomTool
    config:
      type: native
    tool_schema:
      type: function
      function:
        name: image_zoom_in_tool
        description: Crop the initial visible image. Give [x1, y1, x2, y2] in normalized coordinates from 0 to 1000, with x scaled to image width and y scaled to image height.
        parameters:
          type: object
          properties:
            bbox_2d:
              type: array
              items:
                type: number
                minimum: 0
                maximum: 1000
              minItems: 4
              maxItems: 4
            label:
              type: string
              description: Optional descriptive label for the region.
          required: [bbox_2d]
